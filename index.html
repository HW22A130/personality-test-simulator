<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        公営ギャンブル等が“適度な娯楽”として成立するための
        サポートツールサイト
    </title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #e6ecf0;
        }

        .layout {
            max-width: 720px;
            margin: 0 auto;
            background: #f9f9f9;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 16px;
        }

        .notice {
            font-size: 14px;
            color: #555;
            background: #fffde7;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .box {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .donut {
            width: 160px;
            height: 160px;
            margin: 0 auto 10px;
            border-radius: 50%;
            background: conic-gradient(#1976d2 0%,
                    #1976d2 var(--rate),
                    #e0e0e0 var(--rate),
                    #e0e0e0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .button {
            display: block;
            margin: 12px auto 0;
            padding: 12px;
            max-width: 280px;
            background: #1976d2;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
        }

        .sub {
            background: #90a4ae;
        }

        .reset {
            background: #b0bec5;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="layout">
        <h1>
            公営ギャンブル等が“適度な娯楽”として成立するための<br>
            サポートツールサイト
        </h1>

        <div class="notice">
            このサイトは、医療的な診断を行うものではありません。<br>
            公営ギャンブル等との距離感を測るための参考ツールです。
        </div>

        <!-- 診断結果簡易表示 -->
        <div class="box" id="simpleResult"></div>

        <!-- 診断・体験コンテンツ -->
        <div class="box">
            <a class="button" href="check.html">▶ 距離感チェッカーをする</a>
            <a class="button sub" href="cube-race.html">▶ オンライン競馬等の擬似体験</a>
            <a class="button sub" href="quick.html">▶ オンライン宝くじの擬似体験</a>
        </div>

        <!-- コラム -->
        <div class="box">
            <h2 style="font-size:18px;">制作者のコラム</h2>
            <p style="font-size:14px; color:#555;">
                制作者の伝えたいことや体験談を、<br>
                短い読み物形式でまとめています。
            </p>

            <a class="button sub" href="stories/story-01.html">
                ▶ ① 「ギャンブル」って何？
            </a>
            <a class="button sub" href="stories/story-02.html">
                ▶ ② レスポンシブルゲーミングとは？
            </a>
            <a class="button sub" href="stories/story-03.html">
                ▶ ③ 体験を通した、距離感の作り方。
            </a>
        </div>

        <!-- 展示用リセット -->
        <div class="box">
            <p style="font-size:13px;">展示・確認用</p>
            <button class="button reset" onclick="resetData()">診断結果をリセット</button>
        </div>
    </div>

    <script>
        const simpleBox = document.getElementById("simpleResult");
        const result = JSON.parse(localStorage.getItem("riskResult"));

        if (!result) {
            simpleBox.innerHTML = `
                <p><strong>診断結果が入力されていません</strong></p>
                <p style="font-size:14px;">セルフチェックから始めることができます。</p>
            `;
        } else {
            simpleBox.innerHTML = `
                <p>あなたの現在の目安</p>
                <div class="donut" style="--rate:${result.timeRate}%">
                    ${result.timeRate}%
                </div>
                <p style="font-size:14px;">
                    1日の自由時間に占める<br>
                    <strong>公営ギャンブル等の割合</strong>
                </p>
                <a class="button" href="result.html">▶ 診断結果を詳しく見る</a>
            `;
        }

        function resetData() {
            localStorage.removeItem("riskResult");
            alert("診断結果をリセットしました");
            location.reload();
        }
    </script>
</body>

</html>
