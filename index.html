<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>セルフチェック入口</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #e6ecf0;
        }

        /* ===== レイアウト ===== */
        .layout {
            max-width: 720px;
            margin: 0 auto;
            background: #f9f9f9;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .notice {
            font-size: 14px;
            color: #555;
            background: #fffde7;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .box {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* ===== 円グラフ ===== */
        .donut {
            width: 160px;
            height: 160px;
            margin: 0 auto 10px;
            border-radius: 50%;
            background: conic-gradient(#1976d2 0%,
                    #1976d2 var(--rate),
                    #e0e0e0 var(--rate),
                    #e0e0e0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        /* ===== ボタン ===== */
        .button {
            display: block;
            margin: 12px auto 0;
            padding: 12px;
            max-width: 280px;
            background: #1976d2;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
        }

        .sub {
            background: #90a4ae;
        }

        .reset {
            background: #b0bec5;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .layout {
                padding: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="layout">
        <h1>公営ギャンブル等との距離セルフチェック</h1>

        <div class="notice">
            このチェックは、医療的な診断を行うものではありません。<br />
            公営ギャンブル等との関わり方を、振り返るための目安です。
        </div>

        <!-- 診断結果簡易表示 -->
        <div class="box" id="simpleResult"></div>

        <!-- 導線 -->
        <div class="box">
            <a class="button" href="check.html">▶ セルフチェックを行う</a>
            <a class="button sub" href="criteria.html">▶ 診断基準について</a>
        </div>

        <!-- 展示用リセット -->
        <div class="box">
            <p style="font-size:13px;">展示・確認用</p>
            <button class="button reset" onclick="resetData()">診断結果をリセット</button>
        </div>
    </div>

    <script>
        const simpleBox = document.getElementById("simpleResult");
        const result = JSON.parse(localStorage.getItem("riskResult"));
        const rate = localStorage.getItem("preTimeRate") || 0;

        if (!result) {
            simpleBox.innerHTML = `
        <p><strong>診断結果が入力されていません</strong></p>
        <p style="font-size:14px;">まずはセルフチェックを行ってください。</p>
      `;
        } else {
            simpleBox.innerHTML = `
        <p>あなたの現在の目安</p>
        <div class="donut" style="--rate:${rate}%">
          ${rate}%
        </div>
        <p style="font-size:14px;">
          1日の自由時間に占める<br />
          <strong>公営ギャンブル等の割合</strong>
        </p>
        <a class="button" href="result.html">▶ 診断結果を詳しく見る</a>
      `;
        }

        function resetData() {
            localStorage.removeItem("riskResult");
            localStorage.removeItem("preTimeRate");
            alert("診断結果をリセットしました");
            location.reload();
        }
    </script>
</body>

</html>
