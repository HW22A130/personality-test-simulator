<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隙間時間ギャンブル 疑似体験</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #e6ecf0;
            color: #222;
            line-height: 1.8;
        }

        .layout {
            max-width: 760px;
            margin: 0 auto;
            background: #f9f9f9;
            min-height: 100vh;
            padding: 20px;
        }

        h1,
        h2 {
            text-align: center;
            margin: 0;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .lead {
            text-align: center;
            font-size: 15px;
            color: #333;
            margin: 10px 0 20px;
        }

        .box {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .info {
            font-size: 15px;
            margin: 0 0 12px;
        }

        .info strong {
            font-weight: 700;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.95;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .summary {
            font-size: 16px;
            margin-top: 14px;
            background: #f1f3f5;
            padding: 12px;
            border-radius: 8px;
        }

        .log {
            font-size: 14px;
            margin-top: 12px;
            max-height: 160px;
            overflow-y: auto;
            background: #eef2f5;
            padding: 10px;
            border-radius: 6px;
        }

        .reflection-text {
            font-size: 15px;
            color: #222;
        }

        .nav-area {
            margin-top: 18px;
            text-align: center;
        }

        .home-button {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 8px;
            background: #1976d2;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
        }

        .home-button:hover {
            opacity: 0.9;
        }

        /* ====== 離脱前モーダル ====== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 9999;
        }

        .modal {
            width: min(720px, 100%);
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .modal-header {
            padding: 14px 16px;
            background: #0f172a;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
        }

        .modal-body {
            padding: 16px;
            font-size: 14px;
            line-height: 1.7;
        }

        .modal-message {
            background: #eef2f5;
            border-radius: 10px;
            padding: 14px;
            max-height: 48vh;
            overflow: auto;
        }

        .modal-footer {
            padding: 14px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: flex-end;
            border-top: 1px solid #e5e7eb;
            flex-wrap: wrap;
        }

        .modal-footer .left {
            margin-right: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        .btn-secondary {
            width: auto;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #0f172a;
            cursor: pointer;
        }

        .btn-primary {
            width: auto;
            padding: 10px 12px;
            border-radius: 8px;
            border: none;
            background: #1976d2;
            color: #fff;
            cursor: pointer;
        }

        .btn-primary:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="layout">
        <h1>隙間時間ギャンブル 疑似体験</h1>

        <p class="lead">
            1回数十秒で終わる操作を、<br>
            <strong>何度も繰り返した場合</strong>を体験します。
        </p>

        <div class="box">
            <p class="info">1回の購入金額：<strong>300円</strong></p>
            <p class="info">当選確率：<strong>1 / 50</strong></p>

            <button id="playBtn">今すぐ1回引く</button>

            <div class="summary" id="summary">
                回数：0回<br>
                使用金額：0円<br>
                当たり回数：0回
            </div>

            <div class="log" id="logBox"></div>
        </div>

        <div class="box" id="reflection" style="display:none;">
            <h2>振り返り</h2>
            <p class="reflection-text" id="reflectionText"></p>
        </div>

        <!-- ホームに戻る -->
        <div class="nav-area">
            <a class="home-button" id="homeBtn" href="index.html">▶ ホームに戻る</a>
        </div>
    </div>

    <!-- ====== 離脱前モーダル（追加） ====== -->
    <div class="modal-overlay" id="leaveModal" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="leaveTitle">
            <div class="modal-header" id="leaveTitle">ホームへ戻る前に確認してください</div>
            <div class="modal-body">
                <div class="modal-message" id="leaveMessage"></div>
            </div>
            <div class="modal-footer">
                <label class="left">
                    <input type="checkbox" id="ackCheck">
                    <span>メッセージを確認しました</span>
                </label>
                <button type="button" class="btn-secondary" id="cancelLeaveBtn">体験を続ける</button>
                <button type="button" class="btn-primary" id="confirmLeaveBtn" disabled>ホームへ戻る</button>
            </div>
        </div>
    </div>

    <script>
        // ===============================
        // ▼ 設定値
        // ===============================
        const COST = 300;
        const WIN_RATE = 50; // 1 / 50
        const SHOW_REFLECTION_AT = 20;

        let playCount = 0;
        let totalCost = 0;
        let winCount = 0;

        let reflectionShown = false; // ★一度でも振り返りを出したか
        let adminLogged = false;     // ★管理者ログは初回だけ

        const playBtn = document.getElementById("playBtn");
        const summary = document.getElementById("summary");
        const logBox = document.getElementById("logBox");
        const reflection = document.getElementById("reflection");
        const reflectionText = document.getElementById("reflectionText");

        // ★離脱前モーダル要素
        const homeBtn = document.getElementById("homeBtn");
        const leaveModal = document.getElementById("leaveModal");
        const leaveMessage = document.getElementById("leaveMessage");
        const ackCheck = document.getElementById("ackCheck");
        const cancelLeaveBtn = document.getElementById("cancelLeaveBtn");
        const confirmLeaveBtn = document.getElementById("confirmLeaveBtn");

        // ===============================
        // ▼ 表示更新
        // ===============================
        function updateSummary() {
            summary.innerHTML = `
                回数：${playCount}回<br>
                使用金額：${totalCost}円<br>
                当たり回数：${winCount}回
            `;
        }

        function updateReflection() {
            reflectionText.innerHTML = `
                わずか数分の操作でも、<br>
                <strong>${totalCost}円</strong>を使用しています。<br><br>

                隙間時間でのギャンブルは、<br>
                「時間を使っている感覚」が薄いまま<br>
                回数と金額が増えやすい特徴があります。<br><br>

                この体験をもとに、<br>
                自分にとって適切な距離を考えてみてください。
            `;
        }

        // ===============================
        // ▼ 離脱前メッセージ（未達でも必ず読ませる）
        // ===============================
        function buildLeaveMessageHTML() {
            const done = playCount;
            const remain = Math.max(0, SHOW_REFLECTION_AT - done);

            const status = `
                <strong>体験の途中でホームへ戻ろうとしています</strong><br>
                ここまでの体験状況：<br>
                ・回数：<strong>${playCount}回</strong><br>
                ・使用金額：<strong>${totalCost}円</strong><br>
                ・当たり回数：<strong>${winCount}回</strong><br><br>
            `;

            // 20回未満で離脱する人にも同じ「振り返り」をここで提示
            const reflectionLike = `
                隙間時間でのギャンブルは、<br>
                「時間を使っている感覚」が薄いまま<br>
                回数と金額が増えやすい特徴があります。<br><br>

                自分の中で「上限（回数・金額）」を決めたり、<br>
                使った金額をその都度確認したりすることで、<br>
                距離感を保ちやすくなります。<br><br>
            `;

            const tail = (done < SHOW_REFLECTION_AT)
                ? `※この体験は本来<strong>${SHOW_REFLECTION_AT}回</strong>を目安に設計しています（残り：<strong>${remain}回</strong>）。<br>`
                : `※この体験は<strong>${SHOW_REFLECTION_AT}回</strong>以上実施しています。<br>`;

            return status + reflectionLike + tail;
        }

        function openLeaveModal() {
            ackCheck.checked = false;
            confirmLeaveBtn.disabled = true;
            leaveMessage.innerHTML = buildLeaveMessageHTML();
            leaveMessage.scrollTop = 0;

            leaveModal.style.display = "flex";
            leaveModal.setAttribute("aria-hidden", "false");
        }

        function closeLeaveModal() {
            leaveModal.style.display = "none";
            leaveModal.setAttribute("aria-hidden", "true");
        }

        // ===============================
        // ▼ 実行
        // ===============================
        playBtn.onclick = () => {
            playCount++;
            totalCost += COST;

            const isWin = Math.floor(Math.random() * WIN_RATE) === 0;
            if (isWin) winCount++;

            const log = document.createElement("div");
            log.textContent = `【${playCount}回目】${isWin ? "当たり！" : "はずれ"}`;
            logBox.prepend(log);

            updateSummary();

            // ★ 20回到達したら、振り返りを表示（ただしボタンは無効化しない）
            if (playCount >= SHOW_REFLECTION_AT) {
                reflectionShown = true;
                reflection.style.display = "block";
                updateReflection();

                // ★ 管理者用ログ（初回だけ）
                if (!adminLogged) {
                    const logs = JSON.parse(localStorage.getItem("adminLogs")) || [];
                    logs.push({
                        type: "quick_experience",
                        playCount,
                        totalCost,
                        winCount,
                        finishedAt: new Date().toISOString()
                    });
                    localStorage.setItem("adminLogs", JSON.stringify(logs));
                    adminLogged = true;
                }
            }

            // ★ 振り返り表示後も続ける場合、振り返り文を現在値で更新し続ける
            if (reflectionShown) {
                updateReflection();
            }
        };

        // ★「ホームに戻る」押下時に必ずモーダルを挟む
        homeBtn.addEventListener("click", (e) => {
            e.preventDefault();
            openLeaveModal();
        });

        // チェックでボタン解放
        ackCheck.addEventListener("change", () => {
            confirmLeaveBtn.disabled = !ackCheck.checked;
        });

        // 続ける
        cancelLeaveBtn.addEventListener("click", () => {
            closeLeaveModal();
        });

        // ホームへ戻る（チェック済みのみ）
        confirmLeaveBtn.addEventListener("click", () => {
            if (!ackCheck.checked) return;
            window.location.href = "index.html";
        });

        // 背景クリックで閉じる
        leaveModal.addEventListener("click", (e) => {
            if (e.target === leaveModal) closeLeaveModal();
        });

        // ESCで閉じる
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && leaveModal.style.display === "flex") {
                closeLeaveModal();
            }
        });

        // 初期表示
        updateSummary();
    </script>

</body>

</html>
