<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>診断結果</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #e6ecf0;
        }

        .layout {
            max-width: 760px;
            margin: 0 auto;
            background: #f9f9f9;
            min-height: 100vh;
            padding: 20px;
        }

        h1,
        h2 {
            text-align: center;
        }

        .box {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .map-wrapper {
            position: relative;
            max-width: 560px;
            margin: 0 auto;
        }

        .map-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            height: 360px;
        }

        .quadrant {
            padding: 14px 14px 14px 22px;
            font-size: 13px;
            border-radius: 6px;
            line-height: 1.5;
        }

        .q1 {
            background: #e8f5e9;
        }

        .q2 {
            background: #fffde7;
        }

        .q3 {
            background: #fff3e0;
        }

        .q4 {
            background: #ffebee;
        }

        .map-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .dot {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #d32f2f;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            /* 追加：必ず最前面 */
        }

        .x-axis {
            text-align: center;
            font-size: 12px;
            margin-top: 10px;
        }

        .y-axis {
            position: absolute;
            left: -48px;
            top: 50%;
            transform: rotate(-90deg) translateY(-50%);
            font-size: 12px;
        }

        .tick-x,
        .tick-y {
            position: absolute;
            font-size: 10px;
            color: #555;
        }

        .comment {
            background: #eef2f5;
            padding: 15px;
            border-radius: 6px;
            font-size: 14px;
            margin-top: 20px;
        }

        /* 追加：詳細リンク */
        .detail-area {
            text-align: center;
            margin-top: 24px;
        }

        .detail-button {
            background: #ffffff;
            border: 1px solid #ccd6dd;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 14px;
            cursor: pointer;
        }

        .detail-button:hover {
            background: #f2f2f2;
        }

        .medical-note {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }

        /* 追加：支援リンク */
        .support-box {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            margin-top: 32px;
        }

        .support-box h2 {
            font-size: 17px;
            margin-top: 0;
        }

        .support-box p {
            font-size: 14px;
        }

        .support-links {
            padding-left: 18px;
            margin-top: 12px;
        }

        .support-links li {
            margin-bottom: 8px;
        }

        .support-links a {
            color: #0366d6;
            text-decoration: none;
        }

        .support-links a:hover {
            text-decoration: underline;
        }

        .support-note {
            font-size: 12px;
            color: #666;
            margin-top: 12px;
        }

        .label {
            position: absolute;
            font-size: 12px;
            color: #333;
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 6px;
            border-radius: 4px;
            pointer-events: none;
        }

        .label-q1 {
            left: 8px;
            bottom: 8px;
        }

        .label-q2 {
            left: 8px;
            top: 8px;
        }

        .label-q3 {
            right: 8px;
            bottom: 8px;
        }

        .label-q4 {
            right: 8px;
            top: 8px;
        }

        .map-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            /* 追加 */
        }

        /* 現在位置の象限を強調表示 */
        .active-quadrant {
            outline: 3px solid #d32f2f;
            outline-offset: -3px;
            box-shadow: 0 0 0 2px rgba(211, 47, 47, 0.15);
            position: relative;
            z-index: 5;
            /* ← 10 より低く */
        }
    </style>
</head>

<body>
    <div class="layout">
        <h1>診断結果</h1>
        <div id="content"></div>
    </div>

    <script>
        const result = JSON.parse(localStorage.getItem("riskResult"));

        if (!result) {
            document.getElementById("content").innerHTML = `
            <div class="box">
              <p>診断結果が入力されていません。</p>
              <a href="index.html">▶ セルフチェックはこちら</a>
            </div>`;
            throw new Error("未診断");
        }

        const timeRate = Number(result.timeRate);
        const MAX_RISK = 21;

        /* ===== 安全範囲制御 ===== */
        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        const SAFE_MIN = 10;
        const SAFE_MAX = 90;

        let xPercent = clamp(timeRate, SAFE_MIN, SAFE_MAX);
        let yPercent = clamp(
            (result.riskScore / MAX_RISK) * 100,
            SAFE_MIN,
            SAFE_MAX
        );
        /* ============================= */

        /* ===== 象限判定 ===== */
        const quadrant =
            result.riskScore < MAX_RISK / 2 && timeRate < 50 ? 1 :
                result.riskScore >= MAX_RISK / 2 && timeRate < 50 ? 2 :
                    result.riskScore < MAX_RISK / 2 && timeRate >= 50 ? 3 : 4;

        /* ===== 赤丸の自動位置補正（文字回避） ===== */
        const OFFSET = 8; // % 単位で中央に寄せる量

        switch (quadrant) {
            case 1: // 左下（①）→ 右上へ
                xPercent += OFFSET;
                yPercent += OFFSET;
                break;
            case 2: // 左上（②）→ 右下へ
                xPercent += OFFSET;
                yPercent -= OFFSET;
                break;
            case 3: // 右下（③）→ 左上へ
                xPercent -= OFFSET;
                yPercent += OFFSET;
                break;
            case 4: // 右上（④）→ 左下へ
                xPercent -= OFFSET;
                yPercent -= OFFSET;
                break;
        }

        // ずらした後もマップ外に出ないよう再クランプ
        xPercent = clamp(xPercent, SAFE_MIN, SAFE_MAX);
        yPercent = clamp(yPercent, SAFE_MIN, SAFE_MAX);
        /* ======================================= */

        const comments = {
            1: "現在のところ、比較的良い距離感で公営ギャンブル等と関われている状態です。<br>今のバランスを意識しながら楽しむことを一つの目安にしてみてください。",
            2: "公営ギャンブル等が、生活に影響を与え始めている可能性があります。<br>一度立ち止まって、時間やお金の使い方を振り返ってみることをおすすめします。",
            3: "公営ギャンブル等に熱中するあまり、時間の感覚を忘れてしまうことがあるかもしれません。<br>疲れや違和感を感じたら、意識的に休憩をとってみるのも一つの方法です。",
            4: "公営ギャンブル等が、生活に大きな影響を与えている可能性があります。<br>一人で抱え込まず、信頼できる人や支援窓口に相談することも選択肢の一つです。<br>「次は取り返せるかもしれない」と感じたときこそ、一度立ち止まって考えてみてください。"
        };

        document.getElementById("content").innerHTML = `
          <div class="box">
            <p>依存度スコア：<strong>${result.riskScore}</strong></p>
            <p>自由時間に占める割合：<strong>${timeRate}%</strong></p>
          </div>
    
          <h2>現在の位置（4象限）</h2>
    
          <div class="map-wrapper">
            <div class="map-grid">
            <div class="quadrant q2" id="q2">② 依存症の距離感</div>
            <div class="quadrant q4" id="q4">④ 重度の依存症の距離感</div>
            <div class="quadrant q1" id="q1">① 趣味としてちょうど良い距離感</div>
            <div class="quadrant q3" id="q3">③ 大好きな趣味程度の距離感</div>
        </div>
    
            <div class="map-overlay">
              <div class="dot" id="dot"></div>
    
              <div class="tick-x" style="left:25%; bottom:-20px;">25%</div>
              <div class="tick-x" style="left:50%; bottom:-20px;">50%</div>
              <div class="tick-x" style="left:75%; bottom:-20px;">75%</div>
    
              <div class="tick-y" style="left:-34px; bottom:25%;">25%</div>
              <div class="tick-y" style="left:-34px; bottom:50%;">50%</div>
              <div class="tick-y" style="left:-34px; bottom:75%;">75%</div>
    
              <div class="y-axis">依存度（低 → 高）</div>
            </div>
    
            <div class="x-axis">使用時間（少 → 多）</div>
          </div>
    
          <div class="comment">${comments[quadrant]}</div>
    
          <div class="detail-area">
            <button class="detail-button" onclick="location.href='criteria.html'">
              各設問の診断基準・点数配分を詳しく見る
            </button>
            <p class="medical-note">
              ※ 本診断は医療診断ではありません。あくまで自己理解のための参考情報です。
            </p>
          </div>
    
          <div class="support-box">
            <h2>公営ギャンブル等との付き合いに不安を感じたら</h2>
            <p>
              相談や情報提供を行っている支援窓口があります。
              「今すぐ困っているわけではない」という段階でも利用できます。
              診断結果に関わらず、違和感を感じられたら下のサイトを参考にしてください。
            </p>
    
            <ul class="support-links">
              <li><a href="https://www.ncasa-japan.jp/" target="_blank" rel="noopener">依存症相談ナビ（厚生労働省）</a></li>
              <li><a href="https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000149274.html" target="_blank" rel="noopener">ギャンブル等依存症に関する情報（厚生労働省）</a></li>
            </ul>
    
            <p class="support-note">
              ※ 外部サイトへ移動します。匿名・無料で利用できる窓口もあります。
            </p>
          </div>
        `;

        // 赤丸の表示
        const dot = document.getElementById("dot");
        dot.style.left = `${xPercent}%`;
        dot.style.bottom = `${yPercent}%`;

        // 現在位置の象限を赤枠で強調
        const activeQuadrant = document.getElementById(`q${quadrant}`);
        if (activeQuadrant) {
            activeQuadrant.classList.add("active-quadrant");
        }

    </script>

</body>

</html>
