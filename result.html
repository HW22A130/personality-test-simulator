<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>診断結果</title>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #f9f9f9;
        }

        h1,
        h2 {
            text-align: center;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        input[type="range"] {
            width: 100%;
        }

        .map {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
        }

        .quadrant {
            position: relative;
            padding: 10px;
            height: 120px;
            border-radius: 6px;
            font-size: 14px;
        }

        .q1 {
            background: #e8f5e9
        }

        .q2 {
            background: #fffde7
        }

        .q3 {
            background: #fff3e0
        }

        .q4 {
            background: #ffebee
        }

        .dot {
            width: 14px;
            height: 14px;
            background: red;
            border-radius: 50%;
            position: absolute;
            bottom: 10px;
            right: 10px;
        }
    </style>
</head>

<body>

    <h1>診断結果</h1>

    <div id="content"></div>

    <script>
        /* ===============================
           ▼ localStorage 取得
        ================================ */
        const riskResult = JSON.parse(localStorage.getItem("riskResult"));

        /* ===============================
           ▼ 診断未実施の場合
        ================================ */
        if (!riskResult) {
            document.getElementById("content").innerHTML = `
    <div class="box">
      <p>診断結果が見つかりません。</p>
      <p>最初から診断を行ってください。</p>
      <a href="index.html">▶ 診断ページへ戻る</a>
    </div>
  `;
            throw new Error("診断未実施");
        }

        /* ===============================
           ▼ 診断済みUI
        ================================ */
        document.getElementById("content").innerHTML = `
  <div class="box">
    <p>依存度スコア：<strong>${riskResult.riskScore}</strong></p>

    <label>
      趣味時間に占めるギャンブル割合（％）
      <input type="range" min="0" max="100" value="20" id="timeRate">
    </label>
    <p>現在：<span id="rateValue">20</span>%</p>
  </div>

  <h2>あなたの位置</h2>
  <div class="map">
    <div class="quadrant q2" id="q2">② 依存高</div>
    <div class="quadrant q4" id="q4">④ 注意</div>
    <div class="quadrant q1" id="q1">① 適度</div>
    <div class="quadrant q3" id="q3">③ 時間多</div>
  </div>
`;

        /* ===============================
           ▼ 判定ロジック
        ================================ */
        const DEP = 8;
        const TIME = 30;

        const slider = document.getElementById("timeRate");
        const rateValue = document.getElementById("rateValue");

        function getQuadrant(risk, time) {
            if (risk < DEP && time < TIME) return 1;
            if (risk >= DEP && time < TIME) return 2;
            if (risk < DEP && time >= TIME) return 3;
            return 4;
        }

        function update() {
            document.querySelectorAll(".dot").forEach(d => d.remove());
            rateValue.textContent = slider.value;

            const q = getQuadrant(riskResult.riskScore, slider.value);
            const target = document.getElementById("q" + q);

            const dot = document.createElement("div");
            dot.className = "dot";
            target.appendChild(dot);

            localStorage.setItem("timeRate", slider.value);
            localStorage.setItem("quadrantResult", q);
        }

        slider.addEventListener("input", update);
        update();
    </script>

</body>

</html>
