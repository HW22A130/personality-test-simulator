<script>
    // ===============================
    // ▼ 結果取得（第三者対応）
    // ===============================
    const riskScore = Number(localStorage.getItem("riskScore"));
    const playTime = Number(localStorage.getItem("playTimeScore")) || 0;

    if (isNaN(riskScore)) {
        document.getElementById("scoreText").textContent =
            "先に診断を行ってください。";
        throw new Error("診断データなし");
    }

    document.getElementById("scoreText").textContent =
        `依存度スコア：${riskScore}`;

    // ===============================
    // ▼ 4象限判定
    // ===============================
    const DEPENDENCE_BORDER = 8;
    const TIME_BORDER = 30;

    function getQuadrant(risk, time) {
        if (risk < DEPENDENCE_BORDER && time < TIME_BORDER) return 1;
        if (risk >= DEPENDENCE_BORDER && time < TIME_BORDER) return 2;
        if (risk < DEPENDENCE_BORDER && time >= TIME_BORDER) return 3;
        return 4;
    }

    const quadrant = getQuadrant(riskScore, playTime);

    // ===============================
    // ▼ Googleフォーム送信
    // ===============================
    function sendToGoogleForm() {
        const formURL =
            "https://docs.google.com/forms/d/e/1FAIpQLSdBX1JtoqpsJk5neMKoTio64_lPrelfPKw-6GJNoTitaYn5rA/formResponse";

        const data = new FormData();
        data.append("entry.859246831", crypto.randomUUID()); // 診断ID
        data.append("entry.345149634", riskScore);
        data.append("entry.1476647307", playTime);
        data.append("entry.801528040", quadrant);
        data.append("entry.876465189", new Date().toISOString());

        fetch(formURL, {
            method: "POST",
            mode: "no-cors",
            body: data,
        });
    }

    sendToGoogleForm();
</script>
