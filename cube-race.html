<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>キューブレース</title>

    <style>
        body {
            font-family: sans-serif;
            background: #eef2f5;
            margin: 0;
            padding: 20px;
        }

        .layout {
            max-width: 760px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
        }

        h1,
        h2 {
            text-align: center;
        }

        .point {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .point.negative {
            color: #d32f2f;
        }

        .cube-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .cube {
            padding: 14px;
            border: 2px solid #ccc;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            background: #f9f9f9;
            user-select: none;
        }

        .cube.selected {
            border-color: #d32f2f;
            background: #fdecea;
        }

        .cube small {
            display: block;
            font-size: 12px;
            color: #555;
            margin-top: 4px;
        }

        .order {
            display: inline-block;
            margin-top: 6px;
            background: #d32f2f;
            color: #fff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 999px;
        }

        .fav {
            display: inline-block;
            margin-top: 6px;
            background: #1976d2;
            color: #fff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 999px;
            margin-left: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        select,
        input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background: #d32f2f;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .info-box {
            background: #eef2f5;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .bet-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .bet-controls button {
            flex: 1;
            padding: 10px 12px;
            font-size: 14px;
            border-radius: 6px;
            background: #607d8b;
            color: #fff;
        }

        .bet-controls input {
            flex: 2;
        }

        .race-track {
            position: relative;
            height: 200px;
            margin-top: 30px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: linear-gradient(to right, #fafafa, #e0e0e0);
            overflow: hidden;
        }

        .runner {
            position: absolute;
            left: 10px;
            top: 0;
            width: 72px;
            height: 26px;
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            line-height: 26px;
            background: #90caf9;
            will-change: left;
        }

        .runner:nth-child(odd) {
            background: #a5d6a7;
        }

        .runner.win {
            background: #ffcc80;
            font-weight: bold;
        }

        .runner.lose {
            opacity: 0.65;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f1f3f5;
            border-radius: 6px;
        }

        .home-button {
            display: block;
            margin: 30px auto 0;
            padding: 12px 16px;
            border-radius: 8px;
            background: #1976d2;
            color: #fff;
            text-decoration: none;
            text-align: center;
            max-width: 220px;
        }

        /* ====== 離脱前モーダル ====== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 9999;
        }

        .modal {
            width: min(720px, 100%);
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .modal-header {
            padding: 14px 16px;
            background: #0f172a;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
        }

        .modal-body {
            padding: 16px;
            font-size: 14px;
            line-height: 1.7;
        }

        .modal-message {
            background: #eef2f5;
            border-radius: 10px;
            padding: 14px;
            max-height: 48vh;
            overflow: auto;
        }

        .modal-footer {
            padding: 14px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: flex-end;
            border-top: 1px solid #e5e7eb;
            flex-wrap: wrap;
        }

        .modal-footer .left {
            margin-right: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        .btn-secondary {
            width: auto;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #0f172a;
            cursor: pointer;
        }

        .btn-primary {
            width: auto;
            padding: 10px 12px;
            border-radius: 8px;
            border: none;
            background: #1976d2;
            color: #fff;
            cursor: pointer;
        }

        .btn-primary:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="layout">
        <h1>キューブレース体験</h1>

        <button type="button" onclick="toggleGuide()">▶ 遊び方を見る</button>

        <div class="info-box" id="guideBox" style="display:none;">
            ・4つのキューブの中から順位を予想します<br>
            ・単勝：1着を当てる<br>
            ・複勝：選んだキューブが3着以内<br>
            ・ワイド：選んだ2つが両方3着以内<br>
            ・連複：選んだ2つが1・2着（順不同）<br>
            ・連単：1着と2着を順番通り当てる（選んだ順が重要）
        </div>

        <div class="point" id="pointWrap">
            所持ポイント：<span id="point">10000</span>P
        </div>

        <h2>キューブを選ぶ（各キューブの単勝オッズ）</h2>
        <div class="cube-list" id="cubeList"></div>

        <div class="form-group">
            <label>券種を選択</label>
            <select id="betType">
                <option value="単勝">単勝</option>
                <option value="複勝">複勝</option>
                <option value="ワイド">ワイド</option>
                <option value="連複">連複</option>
                <option value="連単">連単</option>
            </select>
        </div>

        <div class="form-group">
            <label>想定オッズ（選択内容に連動）</label>
            <div class="info-box" id="oddsBox">---</div>
        </div>

        <div class="form-group">
            <label>賭けポイント</label>
            <div class="bet-controls">
                <button type="button" onclick="adjustBet(-100)">−100</button>
                <input type="number" id="betAmount" value="1000" min="100" step="100">
                <button type="button" onclick="adjustBet(100)">＋100</button>
            </div>
        </div>

        <button id="betBtn" type="button" onclick="buyTicket()">この内容で賭ける</button>

        <div class="race-track" id="raceTrack"></div>
        <div class="result" id="resultArea"></div>

        <!-- ★変更：id付与 -->
        <a class="home-button" id="homeBtn" href="index.html">▶ ホームに戻る</a>
    </div>

    <!-- ====== 離脱前モーダル（新規追加） ====== -->
    <div class="modal-overlay" id="leaveModal" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="leaveTitle">
            <div class="modal-header" id="leaveTitle">ホームへ戻る前に確認してください</div>
            <div class="modal-body">
                <div class="modal-message" id="leaveMessage"></div>
            </div>
            <div class="modal-footer">
                <label class="left">
                    <input type="checkbox" id="ackCheck">
                    <span>メッセージを確認しました</span>
                </label>
                <button type="button" class="btn-secondary" id="cancelLeaveBtn">体験を続ける</button>
                <button type="button" class="btn-primary" id="confirmLeaveBtn" disabled>ホームへ戻る</button>
            </div>
        </div>
    </div>

    <script>
        const cubeList = document.getElementById("cubeList");
        const pointEl = document.getElementById("point");
        const pointWrap = document.getElementById("pointWrap");
        const resultArea = document.getElementById("resultArea");
        const oddsBox = document.getElementById("oddsBox");
        const betTypeEl = document.getElementById("betType");
        const raceTrack = document.getElementById("raceTrack");
        const betBtn = document.getElementById("betBtn");

        // ★離脱前モーダル要素
        const homeBtn = document.getElementById("homeBtn");
        const leaveModal = document.getElementById("leaveModal");
        const leaveMessage = document.getElementById("leaveMessage");
        const ackCheck = document.getElementById("ackCheck");
        const cancelLeaveBtn = document.getElementById("cancelLeaveBtn");
        const confirmLeaveBtn = document.getElementById("confirmLeaveBtn");

        let points = 10000;
        let selected = [];
        let raceCount = 0;
        let totalBet = 0;
        let currentOdds = null;
        let isRacing = false;

        // 各キューブの単勝オッズ（固定）
        let cubeOdds = {};
        let favoriteCube = 1;

        function updatePointView() {
            pointEl.textContent = points;
            pointWrap.classList.toggle("negative", points < 0);
        }

        function shuffle(arr) {
            return arr.slice().sort(() => Math.random() - 0.5);
        }

        // 単勝オッズを初期生成（ページ読み込み時に固定）
        function initCubeOdds() {
            const base = [1.6, 2.3, 3.2, 4.6];
            const shuffled = shuffle(base);

            cubeOdds = {};
            for (let i = 1; i <= 4; i++) {
                cubeOdds[i] = Number(shuffled[i - 1].toFixed(1));
            }

            favoriteCube = Object.keys(cubeOdds)
                .map(n => Number(n))
                .sort((a, b) => cubeOdds[a] - cubeOdds[b])[0];
        }

        function cubeLabelHTML(n) {
            const orderIndex = selected.indexOf(n);
            const isFav = (n === favoriteCube);
            const odds = cubeOdds[n];

            let tags = "";
            if (orderIndex !== -1) tags += `<span class="order">${orderIndex + 1}番目</span>`;
            if (isFav) tags += `<span class="fav">1番人気</span>`;

            return `
                キューブ${n}
                <small>単勝オッズ ×${odds}</small>
                ${tags ? `<div style="margin-top:6px;">${tags}</div>` : ""}
            `;
        }

        function renderCubes() {
            cubeList.innerHTML = "";
            selected = [];

            for (let i = 1; i <= 4; i++) {
                const div = document.createElement("div");
                div.className = "cube";
                div.dataset.num = i;
                div.innerHTML = cubeLabelHTML(i);
                div.onclick = () => toggleSelect(i);
                cubeList.appendChild(div);
            }
        }

        function refreshCubeView() {
            [...cubeList.children].forEach(c => {
                const n = Number(c.dataset.num);
                c.classList.toggle("selected", selected.includes(n));
                c.innerHTML = cubeLabelHTML(n);
            });
        }

        function needCountByType(type) {
            return (type === "ワイド" || type === "連複" || type === "連単") ? 2 : 1;
        }

        function toggleSelect(num) {
            if (isRacing) return;

            if (selected.includes(num)) {
                selected = selected.filter(n => n !== num);
            } else {
                selected.push(num);
            }

            const type = betTypeEl.value;
            const need = needCountByType(type);

            if (selected.length > need) {
                selected.shift();
            }

            refreshCubeView();
            updateOdds();
        }

        function calcTicketOdds(type, selectedNums) {
            const need = needCountByType(type);
            if (selectedNums.length !== need) return null;

            const a = cubeOdds[selectedNums[0]];
            const b = need === 2 ? cubeOdds[selectedNums[1]] : null;

            if (type === "単勝") {
                return a;
            }
            if (type === "複勝") {
                return Math.max(1.1, Number((a * 0.65).toFixed(1)));
            }
            if (type === "ワイド") {
                return Number(((a + b) * 0.55).toFixed(1));
            }
            if (type === "連複") {
                return Number(((a + b) * 0.85).toFixed(1));
            }
            if (type === "連単") {
                return Number(((a * b) * 0.55).toFixed(1));
            }
            return null;
        }

        function formatBetInfo(type) {
            if (type === "単勝" || type === "複勝") {
                return `${type}：キューブ${selected[0]}`;
            }
            if (type === "連単") {
                return `${type}：1着→キューブ${selected[0]} / 2着→キューブ${selected[1]}（選んだ順）`;
            }
            return `${type}：キューブ${selected[0]} ＆ キューブ${selected[1]}`;
        }

        function updateOdds() {
            const type = betTypeEl.value;

            const need = needCountByType(type);
            if (selected.length > need) {
                while (selected.length > need) selected.shift();
                refreshCubeView();
            }

            const odds = calcTicketOdds(type, selected);

            if (odds == null) {
                currentOdds = null;
                const msgNeed = needCountByType(type);
                oddsBox.textContent = `キューブを${msgNeed}つ選ぶと表示されます`;
                return;
            }

            currentOdds = odds;

            oddsBox.innerHTML = `
                <div><strong>${formatBetInfo(type)}</strong></div>
                <div style="margin-top:6px;">想定オッズ：<strong>×${currentOdds}</strong></div>
            `;
        }

        betTypeEl.addEventListener("change", () => {
            updateOdds();
            refreshCubeView();
        });

        function adjustBet(delta) {
            const input = document.getElementById("betAmount");
            const next = Math.max(100, (Number(input.value) || 0) + delta);
            input.value = Math.round(next / 100) * 100;
        }

        function toggleGuide() {
            const box = document.getElementById("guideBox");
            box.style.display = box.style.display === "none" ? "block" : "none";
        }

        function ensureSelectionValidOrAlert() {
            const type = betTypeEl.value;
            const need = needCountByType(type);
            if (selected.length !== need) {
                alert(`この券種は「${need}つ」キューブを選んでください`);
                return false;
            }
            return true;
        }

        function moveRunnerLeft(runnerEl, targetLeftPx, durationMs) {
            runnerEl.style.transition = "none";
            runnerEl.style.left = "10px";

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    runnerEl.style.transition = `left ${durationMs}ms ease-out`;
                    runnerEl.style.left = `${targetLeftPx}px`;
                });
            });
        }

        function renderRaceRunners() {
            raceTrack.innerHTML = "";
            const laneGap = 42;
            for (let i = 1; i <= 4; i++) {
                const r = document.createElement("div");
                r.className = "runner";
                r.textContent = `#${i}`;
                r.style.top = `${12 + (i - 1) * laneGap}px`;
                raceTrack.appendChild(r);
            }
        }

        function buyTicket() {
            if (isRacing) return;

            const bet = Number(document.getElementById("betAmount").value);
            if (!Number.isFinite(bet) || bet < 100) {
                alert("賭けポイントを100以上で入力してください");
                return;
            }

            if (!ensureSelectionValidOrAlert()) return;

            if (currentOdds == null) {
                updateOdds();
                if (currentOdds == null) {
                    alert("想定オッズが未確定です。キューブの選択を確認してください。");
                    return;
                }
            }

            points -= bet;
            totalBet += bet;
            raceCount++;
            updatePointView();

            isRacing = true;
            betBtn.disabled = true;

            const finish = shuffle([1, 2, 3, 4]);
            renderRaceRunners();

            const trackWidth = raceTrack.getBoundingClientRect().width;
            const goalLeft = Math.max(10, Math.floor(trackWidth - 72 - 16));

            const runners = [...raceTrack.querySelectorAll(".runner")];
            const base = goalLeft;
            const offsets = [0, -35, -70, -105];
            const times = [1700, 1950, 2200, 2450];

            const byNum = {};
            runners.forEach(el => {
                const n = Number(el.textContent.replace("#", ""));
                byNum[n] = el;
            });

            finish.forEach((cubeNum, rankIndex) => {
                const el = byNum[cubeNum];
                const target = base + offsets[rankIndex];
                moveRunnerLeft(el, target, times[rankIndex]);
            });

            let win = false;
            const type = betTypeEl.value;

            if (type === "単勝") win = selected.includes(finish[0]);
            if (type === "複勝") win = selected.some(n => finish.slice(0, 3).includes(n));
            if (type === "ワイド") win = selected.length >= 2 && selected.every(n => finish.slice(0, 3).includes(n));
            if (type === "連複") win = selected.length >= 2 && selected.includes(finish[0]) && selected.includes(finish[1]);
            if (type === "連単") win = selected[0] === finish[0] && selected[1] === finish[1];

            const showAfter = 2550;
            setTimeout(() => {
                const betInfo = formatBetInfo(type);
                let resultText = `${betInfo}<br>結果：${finish.join(" → ")}<br>`;

                finish.forEach((cubeNum, idx) => {
                    const el = byNum[cubeNum];
                    if (!el) return;
                    if (idx === 0) el.classList.add("win");
                    else el.classList.add("lose");
                });

                if (win) {
                    const gain = Math.floor(bet * currentOdds);
                    points += gain;
                    resultText += `的中！ +${gain}P（想定オッズ×${currentOdds}）`;
                } else {
                    resultText += `はずれ（想定オッズ×${currentOdds}）`;
                }

                updatePointView();
                resultArea.innerHTML = resultText;

                updateOdds();

                if (raceCount >= 5) {
                    resultArea.innerHTML += `
                        <hr>
                        <strong>5レース終了</strong><br>
                        使用合計：${totalBet}P<br><br>
                        短時間で何度も賭けられる仕組みは、
                        気づかないうちに使用金額が増えてしまう危険性があります。<br><br>
                        実際の発券場では次レースまで時間が空き、
                        投票するかを考える間ができますが、オンラインではその感覚が薄まります。<br><br>
                        1レースごとに「今回いくら使ったか」を確認するなど、
                        自分なりの付き合い方を目指してください。
                    `;
                }

                isRacing = false;
                betBtn.disabled = false;
            }, showAfter);
        }

        /* =========================
           ★ここから：離脱前モーダル制御（新規追加）
        ========================= */

        function buildLeaveMessageHTML() {
            // 途中離脱でも「気づかないうちに使用金額が増える」意図が伝わるように、
            // 現状の回数と合計使用を差し込む
            const done = raceCount;
            const remain = Math.max(0, 5 - done);

            const head = `
                <strong>体験の途中でホームへ戻ろうとしています</strong><br>
                ここまでの体験状況：<br>
                ・実施レース数：<strong>${done}回</strong><br>
                ・使用合計：<strong>${totalBet}P</strong><br><br>
            `;

            const body = `
                短時間で何度も賭けられる仕組みは、気づかないうちに使用金額が増えてしまう危険性があります。<br><br>
                実際の発券場では次レースまで時間が空き、投票するかを考える間ができますが、
                オンラインではその感覚が薄まりやすいです。<br><br>
                1レースごとに「今回いくら使ったか」を確認する、上限を決めるなど、
                自分なりの付き合い方を目指してください。<br><br>
            `;

            const tail = (done < 5)
                ? `※この体験は本来<strong>5回</strong>を目安に設計しています（残り：<strong>${remain}回</strong>）。<br>`
                : `※5回以上体験しています。<br>`;

            return head + body + tail;
        }

        function openLeaveModal() {
            ackCheck.checked = false;
            confirmLeaveBtn.disabled = true;
            leaveMessage.innerHTML = buildLeaveMessageHTML();

            leaveModal.style.display = "flex";
            leaveModal.setAttribute("aria-hidden", "false");

            // メッセージの先頭へ
            leaveMessage.scrollTop = 0;
        }

        function closeLeaveModal() {
            leaveModal.style.display = "none";
            leaveModal.setAttribute("aria-hidden", "true");
        }

        // 「ホームに戻る」を押した時に必ずモーダルを挟む
        homeBtn.addEventListener("click", (e) => {
            e.preventDefault();

            // レース中に抜けられると挙動が不安定なので防止
            if (isRacing) {
                alert("レース中はホームに戻れません。結果表示後にお試しください。");
                return;
            }

            openLeaveModal();
        });

        // チェックでボタン解放
        ackCheck.addEventListener("change", () => {
            confirmLeaveBtn.disabled = !ackCheck.checked;
        });

        // 続ける
        cancelLeaveBtn.addEventListener("click", () => {
            closeLeaveModal();
        });

        // ホームへ戻る（チェック済みのみ）
        confirmLeaveBtn.addEventListener("click", () => {
            if (!ackCheck.checked) return;
            window.location.href = "index.html";
        });

        // 背景クリックで閉じる（誤操作防止のため、閉じるだけにする）
        leaveModal.addEventListener("click", (e) => {
            if (e.target === leaveModal) closeLeaveModal();
        });

        // ESCで閉じる
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && leaveModal.style.display === "flex") {
                closeLeaveModal();
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            initCubeOdds();
            renderCubes();
            renderRaceRunners();
            updatePointView();
            updateOdds();
        });
    </script>
</body>

</html>
