<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>キューブレース</title>

    <style>
        body {
            font-family: sans-serif;
            background: #eef2f5;
            margin: 0;
            padding: 20px;
        }

        .layout {
            max-width: 760px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
        }

        h1,
        h2 {
            text-align: center;
        }

        .point {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* ★ 追加：マイナスになったら赤く見せる */
        .point.negative {
            color: #d32f2f;
        }

        .cube-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .cube {
            padding: 14px;
            border: 2px solid #ccc;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            background: #f9f9f9;
            user-select: none;
        }

        .cube.selected {
            border-color: #d32f2f;
            background: #fdecea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        select,
        input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background: #d32f2f;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .info-box {
            background: #eef2f5;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .bet-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .bet-controls button {
            flex: 1;
            /* ← 追加：左右同じ幅にする */
            padding: 10px 12px;
            font-size: 14px;
            border-radius: 6px;
            background: #607d8b;
            color: #fff;
        }

        .bet-controls input {
            flex: 2;
            /* ← 中央を少し広めに */
        }

        .race-track {
            position: relative;
            height: 200px;
            margin-top: 30px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: linear-gradient(to right, #fafafa, #e0e0e0);
            overflow: hidden;
        }

        .runner {
            position: absolute;
            left: 10px;
            top: 0;
            width: 72px;
            height: 26px;
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            line-height: 26px;
            background: #90caf9;
            will-change: left;
        }

        .runner:nth-child(odd) {
            background: #a5d6a7;
        }

        .runner.win {
            background: #ffcc80;
            font-weight: bold;
        }

        .runner.lose {
            opacity: 0.65;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f1f3f5;
            border-radius: 6px;
        }

        .home-button {
            display: block;
            margin: 30px auto 0;
            padding: 12px 16px;
            border-radius: 8px;
            background: #1976d2;
            color: #fff;
            text-decoration: none;
            text-align: center;
            max-width: 220px;
        }
    </style>
</head>

<body>
    <div class="layout">
        <h1>キューブレース体験</h1>

        <button type="button" onclick="toggleGuide()">▶ 遊び方を見る</button>

        <div class="info-box" id="guideBox" style="display:none;">
            ・4つのキューブの中から順位を予想します<br>
            ・単勝：1着を当てる<br>
            ・複勝：選んだキューブが3着以内<br>
            ・ワイド：選んだ2つが両方3着以内<br>
            ・連複：選んだ2つが1・2着（順不同）<br>
            ・連単：1着と2着を順番通り当てる
        </div>

        <div class="point" id="pointWrap">
            所持ポイント：<span id="point">10000</span>P
        </div>

        <h2>キューブを選ぶ</h2>
        <div class="cube-list" id="cubeList"></div>

        <div class="form-group">
            <label>券種を選択</label>
            <select id="betType">
                <option value="単勝">単勝</option>
                <option value="複勝">複勝</option>
                <option value="ワイド">ワイド</option>
                <option value="連複">連複</option>
                <option value="連単">連単</option>
            </select>
        </div>

        <div class="form-group">
            <label>想定オッズ</label>
            <div class="info-box" id="oddsBox">---</div>
        </div>

        <div class="form-group">
            <label>賭けポイント</label>
            <div class="bet-controls">
                <button type="button" onclick="adjustBet(-100)">−100</button>
                <input type="number" id="betAmount" value="1000" min="100" step="100">
                <button type="button" onclick="adjustBet(100)">＋100</button>
            </div>
        </div>

        <button id="betBtn" type="button" onclick="buyTicket()">この内容で賭ける</button>

        <div class="race-track" id="raceTrack"></div>
        <div class="result" id="resultArea"></div>

        <a class="home-button" href="index.html">▶ ホームに戻る</a>
    </div>

    <script>
        const cubeList = document.getElementById("cubeList");
        const pointEl = document.getElementById("point");
        const pointWrap = document.getElementById("pointWrap");
        const resultArea = document.getElementById("resultArea");
        const oddsBox = document.getElementById("oddsBox");
        const betTypeEl = document.getElementById("betType");
        const raceTrack = document.getElementById("raceTrack");
        const betBtn = document.getElementById("betBtn");

        let points = 10000;
        let selected = [];
        let raceCount = 0;
        let totalBet = 0;
        let currentOdds = 1;
        let isRacing = false;

        function updatePointView() {
            pointEl.textContent = points;
            pointWrap.classList.toggle("negative", points < 0);
        }

        function renderCubes() {
            cubeList.innerHTML = "";
            selected = [];
            for (let i = 1; i <= 4; i++) {
                const div = document.createElement("div");
                div.className = "cube";
                div.textContent = "キューブ" + i;
                div.onclick = () => toggleSelect(i, div);
                cubeList.appendChild(div);
            }
        }

        function toggleSelect(num, el) {
            if (isRacing) return;

            if (selected.includes(num)) {
                selected = selected.filter(n => n !== num);
                el.classList.remove("selected");
            } else {
                selected.push(num);
                el.classList.add("selected");
            }

            const type = betTypeEl.value;
            const need = (type === "ワイド" || type === "連複" || type === "連単") ? 2 : 1;

            if (selected.length > need) {
                const removed = selected.shift();
                [...cubeList.children].forEach(c => {
                    if (c.textContent === "キューブ" + removed) c.classList.remove("selected");
                });
            }

            updateOdds();
        }

        function calcOdds(type) {
            switch (type) {
                case "単勝": return (1.4 + Math.random() * 0.8).toFixed(1);
                case "複勝": return (1.1 + Math.random() * 0.5).toFixed(1);
                case "ワイド": return (1.8 + Math.random() * 1.4).toFixed(1);
                case "連複": return (2.8 + Math.random() * 2.0).toFixed(1);
                case "連単": return (4.0 + Math.random() * 3.0).toFixed(1);
                default: return "2.0";
            }
        }

        function updateOdds() {
            const type = betTypeEl.value;
            currentOdds = Number(calcOdds(type));
            oddsBox.textContent = `×${currentOdds}`;

            const need = (type === "ワイド" || type === "連複" || type === "連単") ? 2 : 1;
            if (selected.length > need) {
                while (selected.length > need) selected.shift();
                [...cubeList.children].forEach(c => {
                    const num = Number(c.textContent.replace("キューブ", ""));
                    c.classList.toggle("selected", selected.includes(num));
                });
            }
        }

        betTypeEl.addEventListener("change", updateOdds);

        function adjustBet(delta) {
            const input = document.getElementById("betAmount");
            const next = Math.max(100, (Number(input.value) || 0) + delta);
            input.value = Math.round(next / 100) * 100;
        }

        function toggleGuide() {
            const box = document.getElementById("guideBox");
            box.style.display = box.style.display === "none" ? "block" : "none";
        }

        function shuffle(arr) {
            return arr.slice().sort(() => Math.random() - 0.5);
        }

        function ensureSelectionValidOrAlert() {
            const type = betTypeEl.value;
            const need = (type === "ワイド" || type === "連複" || type === "連単") ? 2 : 1;
            if (selected.length !== need) {
                alert(`この券種は「${need}つ」キューブを選んでください`);
                return false;
            }
            return true;
        }

        function moveRunnerLeft(runnerEl, targetLeftPx, durationMs) {
            runnerEl.style.transition = "none";
            runnerEl.style.left = "10px";

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    runnerEl.style.transition = `left ${durationMs}ms ease-out`;
                    runnerEl.style.left = `${targetLeftPx}px`;
                });
            });
        }

        function renderRaceRunners() {
            raceTrack.innerHTML = "";
            const laneGap = 42;
            for (let i = 1; i <= 4; i++) {
                const r = document.createElement("div");
                r.className = "runner";
                r.textContent = `#${i}`;
                r.style.top = `${12 + (i - 1) * laneGap}px`;
                raceTrack.appendChild(r);
            }
        }

        function buyTicket() {
            if (isRacing) return;

            const bet = Number(document.getElementById("betAmount").value);
            if (!Number.isFinite(bet) || bet < 100) {
                alert("賭けポイントを100以上で入力してください");
                return;
            }

            if (!ensureSelectionValidOrAlert()) return;

            // ★ 修正：ポイント不足でも賭けられる（上限なし）
            points -= bet;
            totalBet += bet;
            raceCount++;
            updatePointView();

            isRacing = true;
            betBtn.disabled = true;

            const finish = shuffle([1, 2, 3, 4]);
            renderRaceRunners();

            const trackWidth = raceTrack.getBoundingClientRect().width;
            const goalLeft = Math.max(10, Math.floor(trackWidth - 72 - 16));

            const runners = [...raceTrack.querySelectorAll(".runner")];
            const base = goalLeft;
            const offsets = [0, -35, -70, -105];
            const times = [1700, 1950, 2200, 2450];

            const byNum = {};
            runners.forEach(el => {
                const n = Number(el.textContent.replace("#", ""));
                byNum[n] = el;
            });

            finish.forEach((cubeNum, rankIndex) => {
                const el = byNum[cubeNum];
                const target = base + offsets[rankIndex];
                moveRunnerLeft(el, target, times[rankIndex]);
            });

            let win = false;
            const type = betTypeEl.value;

            if (type === "単勝") win = selected.includes(finish[0]);
            if (type === "複勝") win = selected.some(n => finish.slice(0, 3).includes(n));
            if (type === "ワイド") win = selected.length >= 2 && selected.every(n => finish.slice(0, 3).includes(n));
            if (type === "連複") win = selected.length >= 2 && selected.includes(finish[0]) && selected.includes(finish[1]);
            if (type === "連単") win = selected[0] === finish[0] && selected[1] === finish[1];

            const showAfter = 2550;
            setTimeout(() => {
                let resultText = `結果：${finish.join(" → ")}<br>`;

                finish.forEach((cubeNum, idx) => {
                    const el = byNum[cubeNum];
                    if (!el) return;
                    if (idx === 0) el.classList.add("win");
                    else el.classList.add("lose");
                });

                if (win) {
                    const gain = Math.floor(bet * currentOdds);
                    points += gain;
                    resultText += `的中！ +${gain}P（オッズ×${currentOdds}）`;
                } else {
                    resultText += `はずれ（オッズ×${currentOdds}）`;
                }

                updatePointView();
                resultArea.innerHTML = resultText;

                updateOdds();

                if (raceCount >= 5) {
                    resultArea.innerHTML += `
                        <hr>
                        <strong>5レース終了</strong><br>
                        使用合計：${totalBet}P<br><br>
                        短時間で何度も賭けられる仕組みは、
                        気づかないうちに使用金額が増えてしまう危険性があります。<br><br>
                        実際の発券場では次レースまで時間が空き、
                        投票するかを考える間ができますが、オンラインではその感覚が薄まります。<br><br>
                        1レースごとに「今回いくら使ったか」を確認するなど、
                        自分なりの付き合い方を目指してください。
                    `;
                }

                isRacing = false;
                betBtn.disabled = false;
            }, showAfter);
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderCubes();
            updateOdds();
            renderRaceRunners();
            updatePointView();
        });
    </script>
</body>

</html>
