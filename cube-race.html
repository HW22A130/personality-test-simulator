<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>キューブレース</title>

    <style>
        body {
            font-family: sans-serif;
            background: #eef2f5;
            margin: 0;
            padding: 20px;
        }

        .layout {
            max-width: 760px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
        }

        h1,
        h2 {
            text-align: center;
        }

        .point {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .cube-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .cube {
            padding: 14px;
            border: 2px solid #ccc;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            background: #f9f9f9;
            user-select: none;
        }

        .cube.selected {
            border-color: #d32f2f;
            background: #fdecea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        select,
        input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background: #d32f2f;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f1f3f5;
            border-radius: 6px;
        }

        /* =========================
           賭けポイント：操作ボタン
        ========================= */
        .bet-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .bet-controls button {
            width: auto;
            padding: 10px 12px;
            font-size: 14px;
            border-radius: 6px;
        }

        .bet-controls .bet-btn {
            background: #607d8b;
            color: #fff;
            flex: 0 0 auto;
            min-width: 88px;
        }

        .bet-controls .bet-btn:hover {
            opacity: 0.9;
        }

        .bet-controls input {
            flex: 1 1 auto;
        }

        /* =========================
           レース表示（簡易演出）
        ========================= */

        .race-track {
            position: relative;
            height: 260px;
            margin-top: 30px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: linear-gradient(to right, #fafafa, #e0e0e0);
            overflow: hidden;
        }

        .runner {
            position: absolute;
            left: 10px;
            width: 72px;
            height: 26px;
            border-radius: 4px;
            text-align: center;
            font-size: 12px;
            line-height: 26px;
            background: #90caf9;
            transition: transform 2.2s ease-out;
        }

        .runner:nth-child(odd) {
            background: #a5d6a7;
        }

        .runner.win {
            background: #ffcc80;
            font-weight: bold;
        }

        .runner.lose {
            opacity: 0.6;
        }

        /* =========================
           下部ナビ（ホームに戻る）
        ========================= */
        .nav-area {
            margin-top: 22px;
            text-align: center;
        }

        .home-button {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 8px;
            background: #1976d2;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
        }

        .home-button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="layout">
        <h1>キューブレース体験</h1>

        <div class="point">
            所持ポイント：<span id="point">---</span>P
        </div>

        <h2>キューブを選ぶ</h2>
        <div class="cube-list" id="cubeList"></div>

        <div class="form-group">
            <label>券種を選択</label>
            <select id="betType">
                <option value="単勝">単勝</option>
                <option value="複勝">複勝</option>
                <option value="ワイド">ワイド</option>
            </select>
        </div>

        <div class="form-group">
            <label>賭けポイント（100ずつ）</label>

            <!-- ★ 操作しやすいようにボタン追加 -->
            <div class="bet-controls">
                <button type="button" class="bet-btn" onclick="adjustBet(-100)">−100</button>

                <!-- ★ 100刻みに変更：step="100" -->
                <input type="number" id="betAmount" value="1000" min="100" step="100">

                <button type="button" class="bet-btn" onclick="adjustBet(100)">＋100</button>
            </div>
        </div>

        <button onclick="buyTicket()">この内容で賭ける</button>

        <!-- レース可視化エリア -->
        <div class="race-track" id="raceTrack"></div>

        <div class="result" id="resultArea"></div>

        <!-- ★ ホームに戻る -->
        <div class="nav-area">
            <a class="home-button" href="index.html">▶ ホームに戻る</a>
        </div>
    </div>

    <script>
        // 賭けポイントを100刻みで増減（最低100まで）
        function adjustBet(delta) {
            const input = document.getElementById("betAmount");
            const current = Number(input.value) || 0;
            const next = Math.max(100, current + delta);

            // 100刻みに丸める（念のため）
            input.value = Math.round(next / 100) * 100;
        }
    </script>

    <script src="cube-race.js"></script>
</body>

</html>
